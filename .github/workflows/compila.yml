name: Compila APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le dipendenze di sistema Android e Kivy
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-pip libffi-dev
        pip install --upgrade pip
        # Installazione stabile di Cython e Buildozer
        pip install "cython<3.0.0" buildozer

    - name: Compila l'APK con Buildozer
      run: |
        # Accetta in automatico le licenze Android prima di compilare
        mkdir -p ~/.buildozer
        echo "android.accept_sdk_license = True" >> buildozer.spec
        # Avvia la compilazione effettiva
        buildozer android debug

    - name: Carica l'APK finale nei download di GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Bedge-APK-Debug
        path: bin/*.apk
